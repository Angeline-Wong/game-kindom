<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宫廷帘幕过场与消息弹窗</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    display:grid;
    place-items:center;
    background:#120a08;
    font-family:"STKaiti","KaiTi","Noto Serif SC",serif;
  }

  .scene{
    position:relative;
    width:min(100vw,430px);
    height:min(100vh,932px);
    min-height:720px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%,rgba(165,69,52,.18),transparent 34%),
      linear-gradient(180deg,#2b1511,#120907 78%);
  }

  .room{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
      linear-gradient(rgba(25,10,8,.18),rgba(11,6,5,.38)),
      radial-gradient(circle at 50% 38%,rgba(223,157,80,.12),transparent 28%);
  }

  .window{
    position:absolute;
    left:24px;
    right:24px;
    top:52px;
    height:190px;
    border:2px solid #6f4318;
    background:
      repeating-linear-gradient(90deg,transparent 0 36px,rgba(112,74,31,.50) 36px 39px),
      repeating-linear-gradient(0deg,transparent 0 36px,rgba(112,74,31,.42) 36px 39px),
      linear-gradient(#3e211a,#1c0e0c);
    box-shadow:inset 0 0 34px rgba(0,0,0,.50);
  }

  .moon{
    position:absolute;
    width:72px;
    height:72px;
    right:42px;
    top:35px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff3c7,#dbc384 62%,#aa976a);
    opacity:.66;
    box-shadow:0 0 22px rgba(255,229,154,.23);
  }

  .bed{
    position:absolute;
    left:36px;
    right:36px;
    bottom:118px;
    height:280px;
  }

  .bed-base{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:105px;
    border:2px solid #865719;
    border-radius:18px 18px 8px 8px;
    background:linear-gradient(#6a2923,#351310);
    box-shadow:0 14px 28px rgba(0,0,0,.42);
  }

  .screen{
    position:absolute;
    left:54px;
    right:54px;
    bottom:78px;
    height:205px;
    z-index:4;
    overflow:hidden;
    border:2px solid #986822;
    border-radius:12px;
    background:
      linear-gradient(rgba(242,220,170,.46),rgba(221,188,124,.27)),
      repeating-linear-gradient(90deg,transparent 0 56px,rgba(108,71,27,.32) 56px 59px);
    box-shadow:0 9px 18px rgba(0,0,0,.28);
  }

  .candle{
    position:absolute;
    bottom:102px;
    width:17px;
    height:60px;
    border-radius:4px;
    background:linear-gradient(#e0bf82,#7b4c1a);
    z-index:6;
  }
  .candle.left{left:24px}
  .candle.right{right:24px}

  .flame{
    position:absolute;
    left:50%;
    top:-18px;
    width:10px;
    height:20px;
    transform:translateX(-50%);
    border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 50% 65%,#fff5c3,#f1b649 55%,#b6611c);
    box-shadow:0 0 18px rgba(255,188,76,.58);
    animation:flicker .66s ease-in-out infinite alternate;
  }

  .silhouette{
    position:absolute;
    left:50%;
    bottom:8px;
    width:158px;
    height:165px;
    transform:translateX(-50%);
    opacity:.68;
  }

  .person{
    position:absolute;
    bottom:0;
    width:68px;
    height:132px;
    border-radius:32px 32px 18px 18px;
    background:#26110f;
    filter:blur(.4px);
  }

  .person::before{
    content:"";
    position:absolute;
    left:15px;
    top:-31px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#26110f;
  }

  .person.a{
    left:17px;
    transform:rotate(-5deg);
    animation:leanA 2s ease-in-out infinite;
  }

  .person.b{
    right:17px;
    transform:rotate(5deg);
    animation:leanB 2s ease-in-out infinite;
  }

  .curtain{
    position:absolute;
    top:0;
    bottom:0;
    width:56%;
    z-index:10;
    background:
      linear-gradient(90deg,rgba(124,26,28,.98),rgba(66,13,15,.96));
    box-shadow:inset 0 0 30px rgba(0,0,0,.30);
  }

  .curtain.left{
    left:-34%;
    clip-path:polygon(0 0,100% 0,78% 100%,0 100%);
    animation:closeLeft 3.8s cubic-bezier(.28,.72,.25,1) forwards;
  }

  .curtain.right{
    right:-34%;
    clip-path:polygon(0 0,100% 0,100% 100%,22% 100%);
    animation:closeRight 3.8s cubic-bezier(.28,.72,.25,1) forwards;
  }

  .curtain::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:5px;
    background:linear-gradient(#d4a04d,#744416);
    opacity:.75;
  }
  .curtain.left::after{right:0}
  .curtain.right::after{left:0}

  .caption{
    position:absolute;
    left:0;
    right:0;
    bottom:48px;
    z-index:12;
    text-align:center;
    color:#e7c576;
    font-size:16px;
    letter-spacing:.12em;
    opacity:0;
    animation:captionIn .8s ease 1s forwards;
    text-shadow:0 2px 6px rgba(0,0,0,.65);
  }

  .fade{
    position:absolute;
    inset:0;
    z-index:14;
    background:#120907;
    opacity:0;
    pointer-events:none;
    animation:fadeScene 5.4s ease forwards;
  }

  /* 对话框 */
  .dialog-stage{
    position:absolute;
    left:0;
    right:0;
    bottom:28px;
    z-index:20;
    padding:0 12px;
    opacity:0;
    transform:translateY(22px);
    pointer-events:none;
    transition:.45s ease;
  }

  .dialog-stage.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .dialog-wrap{
    position:relative;
    width:100%;
    filter:drop-shadow(0 16px 24px rgba(0,0,0,.34));
  }

  .skip-btn{
    position:absolute;
    z-index:8;
    right:14px;
    top:8px;
    border:1px solid rgba(171,126,51,.42);
    border-radius:999px;
    padding:3px 9px 3px 10px;
    color:#8b662b;
    background:rgba(255,249,231,.80);
    font:13px/1.3 "STKaiti","KaiTi",serif;
    letter-spacing:.12em;
    cursor:pointer;
  }

  .name-ribbon{
    position:relative;
    z-index:3;
    width:64%;
    min-width:180px;
    height:45px;
    margin-left:10px;
    margin-bottom:-9px;
    display:flex;
    align-items:center;
    padding:0 28px 0 42px;
    color:#513516;
    font-size:21px;
    font-weight:700;
    letter-spacing:.18em;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    background:
      linear-gradient(180deg,rgba(255,255,255,.2),transparent 38%),
      linear-gradient(90deg,#efd98e 0%,#d6b45a 58%,rgba(199,151,62,.94) 78%,rgba(199,151,62,0) 100%);
    border-radius:14px 0 0 0;
  }

  .name-ribbon::before{
    content:"◇";
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:rgba(108,70,24,.48);
    font-size:18px;
  }

  .dialog-box{
    position:relative;
    min-height:160px;
    padding:29px 52px 38px 22px;
    color:#342719;
    font-size:21px;
    line-height:1.72;
    letter-spacing:.055em;
    background:
      linear-gradient(rgba(255,250,235,.97),rgba(248,239,215,.98)),
      repeating-linear-gradient(0deg,transparent 0 28px,rgba(151,116,57,.035) 28px 29px);
    border:3px solid #ead7a9;
    border-radius:15px;
    box-shadow:
      inset 0 0 0 1px rgba(141,103,42,.55),
      inset 0 0 24px rgba(176,132,57,.12),
      0 4px 0 rgba(82,55,22,.24);
  }

  .dialog-box::before{
    content:"";
    position:absolute;
    inset:11px;
    pointer-events:none;
    border:1px solid rgba(176,139,74,.34);
    border-radius:9px;
    clip-path:polygon(0 0,95% 0,100% 20%,100% 100%,0 100%);
  }

  .dialog-box::after{
    content:"";
    position:absolute;
    left:28px;
    right:68px;
    bottom:18px;
    height:1px;
    opacity:.42;
    background:linear-gradient(90deg,transparent,#b58c45 18%,#b58c45 82%,transparent);
  }

  .dialog-text{
    position:relative;
    z-index:2;
    margin:0;
  }

  .next{
    position:absolute;
    right:15px;
    bottom:13px;
    z-index:4;
    width:30px;
    height:28px;
    border:0;
    padding:0;
    background:transparent;
    cursor:pointer;
    animation:nextFloat 1.25s ease-in-out infinite;
  }

  .next::before,
  .next::after{
    content:"";
    position:absolute;
    left:50%;
    width:13px;
    height:13px;
    border-right:3px solid #a77b30;
    border-bottom:3px solid #a77b30;
    transform:translateX(-50%) rotate(45deg);
  }

  .next::before{top:1px}
  .next::after{top:9px}

  @keyframes closeLeft{
    from{left:-34%}
    to{left:-2%}
  }

  @keyframes closeRight{
    from{right:-34%}
    to{right:-2%}
  }

  @keyframes flicker{
    from{transform:translateX(-50%) scale(.9) rotate(-2deg);opacity:.84}
    to{transform:translateX(-50%) scale(1.08) rotate(2deg);opacity:1}
  }

  @keyframes leanA{
    0%,100%{transform:rotate(-5deg) translateX(0)}
    50%{transform:rotate(-2deg) translateX(5px)}
  }

  @keyframes leanB{
    0%,100%{transform:rotate(5deg) translateX(0)}
    50%{transform:rotate(2deg) translateX(-5px)}
  }

  @keyframes captionIn{
    to{opacity:1}
  }

  @keyframes fadeScene{
    0%,74%{opacity:0}
    100%{opacity:.84}
  }

  @keyframes nextFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(2px)}
  }
</style>
</head>
<body>
<div class="scene">
  <div class="room">
    <div class="window"></div>
    <div class="moon"></div>

    <div class="bed">
      <div class="screen">
        <div class="silhouette">
          <div class="person a"></div>
          <div class="person b"></div>
        </div>
      </div>
      <div class="bed-base"></div>
      <div class="candle left"><span class="flame"></span></div>
      <div class="candle right"><span class="flame"></span></div>
    </div>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="caption">红烛摇影，帘幕渐合</div>
  </div>

  <div class="fade"></div>

  <main class="dialog-stage" id="dialogStage">
    <section class="dialog-wrap" aria-label="人物对话弹窗">
      <button class="skip-btn" id="skipBtn">跳过 ›</button>
      <div class="name-ribbon" id="speaker">旁白</div>
      <div class="dialog-box">
        <p class="dialog-text" id="dialogText">风雨过后。</p>
        <button class="next" id="nextBtn" aria-label="下一句"></button>
      </div>
    </section>
  </main>
</div>

<script>
  const dialogStage = document.getElementById('dialogStage');

  setTimeout(() => {
    dialogStage.classList.add('show');
  }, 5000);

  document.getElementById('nextBtn').addEventListener('click', () => {
    const text = document.getElementById('dialogText');
    text.animate(
      [
        { opacity: 0, transform: 'translateY(4px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ],
      { duration: 220, easing: 'ease-out' }
    );
    text.textContent = '烛火未熄，夜色仍深。';
  });

  document.getElementById('skipBtn').addEventListener('click', () => {
    dialogStage.animate(
      [
        { opacity: 1, transform: 'translateY(0)' },
        { opacity: 0, transform: 'translateY(10px)' }
      ],
      { duration: 260, fill: 'forwards', easing: 'ease-in' }
    );
  });
</script>
</body>
</html>
