<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>圣旨颁布演出 · 玉玺盖印</title>
<style>
  :root{
    --gold:#e4b955;
    --gold-hi:#ffe7a5;
    --gold-deep:#764a16;
    --red:#9a2922;
    --red-deep:#55140f;
    --paper:#f4e4b7;
    --paper-2:#d3b36c;
    --jade:#e7f0df;
    --jade-2:#a8c4a7;
    --jade-3:#607e66;
    --ink:#4a2c13;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#100a07;
    font-family:"STKaiti","KaiTi","Noto Serif SC",serif;
  }

  body{display:grid;place-items:center}

  .stage{
    position:relative;
    width:min(100vw,430px);
    height:min(100vh,932px);
    min-height:720px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 42%,rgba(220,169,67,.12),transparent 34%),
      linear-gradient(#2a1e14,#120c08);
  }

  .mask{
    position:absolute;
    inset:0;
    background:rgba(8,5,3,.72);
    backdrop-filter:blur(2px);
  }

  .scene{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:24px 14px;
  }

  .edict{
    position:relative;
    width:min(92vw,394px);
    height:0;
    overflow:hidden;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.50));
    transition:height 2.25s cubic-bezier(.18,.72,.18,1);
  }

  .edict.open{height:min(77vh,700px)}

  .roller{
    position:absolute;
    left:0;
    right:0;
    height:50px;
    z-index:4;
    border:1px solid #764b18;
    background:
      linear-gradient(180deg,rgba(255,255,255,.18),transparent 34%),
      linear-gradient(90deg,#8b5b1e,#dbb251 50%,#8b5b1e);
    box-shadow:
      inset 0 0 0 2px rgba(255,231,152,.16),
      0 5px 12px rgba(0,0,0,.30);
  }

  .roller.top{top:0;border-radius:26px 26px 8px 8px}
  .roller.bottom{bottom:0;border-radius:8px 8px 26px 26px}

  .roller::before{
    content:"";
    position:absolute;
    left:18px;
    right:18px;
    top:50%;
    height:1px;
    background:linear-gradient(90deg,transparent,#ffe7aa,transparent);
    opacity:.75;
  }

  .paper{
    position:absolute;
    left:10px;
    right:10px;
    top:40px;
    bottom:40px;
    overflow:hidden;
    padding:28px 24px 96px;
    color:var(--ink);
    background:
      radial-gradient(circle at 25% 18%,rgba(135,84,22,.08),transparent 24%),
      repeating-linear-gradient(0deg,rgba(77,48,18,.025) 0 1px,transparent 1px 7px),
      linear-gradient(90deg,#d7b86f,#f3e2b1 12%,#f6e9bf 50%,#e0c17b 88%,#c99f4d);
    border-left:1px solid rgba(119,76,22,.42);
    border-right:1px solid rgba(119,76,22,.42);
  }

  .paper::before,
  .paper::after{
    content:"";
    position:absolute;
    top:0;bottom:0;width:12px;
    background:repeating-linear-gradient(0deg,rgba(99,62,19,.17) 0 3px,transparent 3px 8px);
    opacity:.28;
  }
  .paper::before{left:4px}
  .paper::after{right:4px}

  .title{
    margin:0;
    text-align:center;
    color:#7f2b22;
    font-size:27px;
    letter-spacing:.25em;
    text-indent:.25em;
  }

  .subtitle{
    margin-top:5px;
    text-align:center;
    color:#80613a;
    font-size:12px;
    letter-spacing:.18em;
  }

  .text{
    margin-top:18px;
    opacity:0;
    transform:translateY(12px);
    transition:.8s ease;
    font-size:18px;
    line-height:2;
    letter-spacing:.08em;
    text-align:justify;
  }

  .text.show{opacity:1;transform:translateY(0)}
  .text p{margin:0 0 12px}
  .text .em{color:#8f2d23;font-weight:700}

  .signature{
    margin-top:18px;
    text-align:right;
    color:#6d5130;
    font-size:14px;
    line-height:1.7;
  }


  .stamp-trigger{
    position:absolute;
    left:50%;
    bottom:34px;
    z-index:10;
    min-width:138px;
    height:40px;
    padding:0 22px;
    border:1px solid #a9792a;
    border-radius:18px;
    opacity:0;
    transform:translateX(-50%) translateY(12px);
    pointer-events:none;
    cursor:pointer;
    color:#ffe49a;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.14em;
    background:
      linear-gradient(180deg,rgba(255,255,255,.08),transparent 35%),
      linear-gradient(#8d2d25,#51130f);
    box-shadow:
      0 6px 14px rgba(0,0,0,.32),
      inset 0 0 0 1px rgba(255,226,142,.06);
    transition:.45s ease;
  }

  .stamp-trigger.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
    animation:stampPulse 1.7s ease-in-out infinite;
  }

  .stamp-trigger.pressed{
    animation:none;
    transform:translateX(-50%) translateY(5px) scale(.96);
    opacity:.35;
    pointer-events:none;
  }

  /* 印章效果 */
  .stamp-mark{
    position:absolute;
    right:38px;
    bottom:106px;
    width:94px;
    height:94px;
    z-index:7;
    display:grid;
    place-items:center;
    border:6px double #a42720;
    color:#94251e;
    font-size:19px;
    font-weight:700;
    line-height:1.12;
    text-align:center;
    opacity:0;
    transform:rotate(-9deg) scale(1.55);
    mix-blend-mode:multiply;
  }

  .stamp-mark.stamped{
    animation:stampAppear .48s cubic-bezier(.15,.95,.2,1) forwards;
  }

  .shock{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at 65% 75%,rgba(255,230,157,.20),transparent 26%);
  }

  .shock.flash{animation:shock .42s ease-out}

  .particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:12;
  }

  .particle{
    position:absolute;
    width:5px;height:5px;border-radius:50%;
    background:#f0ca66;
    opacity:0;
  }

  .hint{
    position:absolute;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    color:#d8bc7a;
    font-size:12px;
    letter-spacing:.1em;
    white-space:nowrap;
  }

  .start{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:20;
    min-width:150px;
    height:42px;
    border:1px solid #a9792a;
    border-radius:18px;
    background:linear-gradient(#8d2d25,#51130f);
    color:#ffe39a;
    font-family:inherit;
    font-size:16px;
    letter-spacing:.14em;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,.32);
  }

  .start.hidden{display:none}

  .complete{
    position:absolute;
    inset:0;
    z-index:30;
    display:grid;
    place-items:center;
    background:rgba(8,5,3,.42);
    opacity:0;
    pointer-events:none;
    transition:.4s ease;
  }

  .complete.show{opacity:1;pointer-events:auto}

  .complete-card{
    padding:19px 30px;
    border-radius:17px;
    border:1px solid #9a6924;
    background:linear-gradient(#2c1a10,#160e0a);
    color:#f1d078;
    text-align:center;
    box-shadow:0 14px 30px rgba(0,0,0,.42);
  }

  .complete-card b{
    display:block;
    font-size:22px;
    letter-spacing:.15em;
    margin-bottom:5px;
  }

  .complete-card span{color:#b79a5d;font-size:12px}

  @keyframes stampAppear{
    0%{opacity:0;transform:rotate(-9deg) scale(1.55)}
    55%{opacity:.92;transform:rotate(-9deg) scale(.92)}
    100%{opacity:.82;transform:rotate(-9deg) scale(1)}
  }

  @keyframes shock{
    0%{opacity:0}
    30%{opacity:1}
    100%{opacity:0}
  }

  @keyframes particleFly{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    25%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
  }


  @keyframes stampPulse{
    0%,100%{
      box-shadow:0 6px 14px rgba(0,0,0,.32),0 0 0 0 rgba(224,178,74,0);
    }
    50%{
      box-shadow:0 7px 16px rgba(0,0,0,.36),0 0 0 7px rgba(224,178,74,.09);
    }
  }

  @media(max-height:760px){
    .edict.open{height:82vh}
    .text{font-size:16px}
    .imperial-seal{transform-origin:center bottom}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="mask"></div>

  <div class="scene">
    <section class="edict" id="edict">
      <div class="roller top"></div>

      <div class="paper">
        <h1 class="title">奉天承运</h1>
        <div class="subtitle">皇帝诏曰</div>

        <div class="text" id="edictText">
          <p>朕惟治国之道，在于选贤任能，明赏罚，定纲纪。</p>
          <p>今有翰林院侍讲 <span class="em">沈怀瑾</span>，才识卓著，品行端方，历任有功，深孚众望。</p>
          <p>特擢为 <span class="em">礼部右侍郎</span>，赐金百两，仍令勤勉奉职，辅弼朝纲。</p>
          <p>钦此。</p>

          <div class="signature">
            永和三年 十月十八日<br/>
            大曜皇帝
          </div>
        </div>

        <div class="stamp-mark" id="stampMark">皇帝<br/>之宝</div>

        <button class="stamp-trigger" id="stampTrigger">奉旨用印</button>

        <div class="shock" id="shock"></div>
        <div class="particles" id="particles"></div>
      </div>

      <div class="roller bottom"></div>
    </section>

    <div class="hint" id="hint">圣旨将缓缓展开</div>
    <button class="start" id="startBtn">颁布圣旨</button>
  </div>

  <div class="complete" id="complete">
    <div class="complete-card">
      <b>诏书已成</b>
      <span>圣旨已正式颁布</span>
    </div>
  </div>
</div>

<script>
const edict = document.getElementById("edict");
const edictText = document.getElementById("edictText");
const stampTrigger = document.getElementById("stampTrigger");
const stampMark = document.getElementById("stampMark");
const shock = document.getElementById("shock");
const particles = document.getElementById("particles");
const hint = document.getElementById("hint");
const startBtn = document.getElementById("startBtn");
const complete = document.getElementById("complete");

function spawnParticles(){
  particles.innerHTML = "";
  for(let i=0;i<18;i++){
    const p = document.createElement("span");
    p.className = "particle";
    p.style.left = "66%";
    p.style.top = "73%";
    const angle = Math.random()*Math.PI*2;
    const distance = 35 + Math.random()*60;
    p.style.setProperty("--dx", `${Math.cos(angle)*distance}px`);
    p.style.setProperty("--dy", `${Math.sin(angle)*distance}px`);
    p.style.animation = `particleFly ${0.55+Math.random()*0.35}s ease-out forwards`;
    particles.appendChild(p);
  }
}

startBtn.addEventListener("click",()=>{
  startBtn.classList.add("hidden");
  hint.textContent = "圣旨展开中……";
  edict.classList.add("open");

  setTimeout(()=>{
    edictText.classList.add("show");
    hint.textContent = "诏书内容已显现";
  },1650);

  setTimeout(()=>{
    stampTrigger.classList.add("show");
    hint.textContent = "点击“奉旨用印”完成诏书";
  },3000);
});

stampTrigger.addEventListener("click",()=>{
  if(stampTrigger.classList.contains("pressed")) return;

  stampTrigger.classList.add("pressed");
  hint.textContent = "御印落下！";

  setTimeout(()=>{
    stampMark.classList.add("stamped");
    shock.classList.add("flash");
    spawnParticles();

    document.querySelector(".stage").animate(
      [
        {transform:"translate(0,0)"},
        {transform:"translate(-2px,2px)"},
        {transform:"translate(2px,-1px)"},
        {transform:"translate(0,0)"}
      ],
      {duration:260,easing:"ease-out"}
    );
  },220);

  setTimeout(()=>{
    hint.textContent = "圣旨已加盖御印";
  },620);

  setTimeout(()=>{
    complete.classList.add("show");
  },1200);
});
</script>
</body>
</html>
