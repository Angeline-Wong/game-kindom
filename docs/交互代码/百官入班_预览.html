<title>百官入班 · 重构预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0605; font-family: KaiTi, STKaiti, "Songti SC", serif; }
  .wrap { width: min(100%, 440px); height: min(94vh, 860px); display: flex; flex-direction: column; overflow: hidden; color: #f4dfaa; background: linear-gradient(180deg,#090604bd,#130a07d9 48%,#080504f0), radial-gradient(circle at 50% 37%, #c48a3630, transparent 40%), linear-gradient(90deg,#0503028c,transparent 22%,transparent 78%,#0503028c); border: 1px solid #7a5527; border-radius: 10px; box-shadow: 0 20px 60px #000b; position: relative; }
  .wrap::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 30%,#c48a3620,transparent 42%); }

  /* header */
  .rework-header { flex: 0 0 72px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 8px 14px; color: #f4d786; background: linear-gradient(180deg,#351510ef,#160b08ef); border-bottom: 1px solid #bd8b3e; box-shadow: 0 7px 18px #0009; position: relative; z-index: 2; }
  .back { width: 38px; height: 38px; display: grid; place-items: center; color: #f2d27d; background: #140b08b8; border: 1px solid #b27c2b; border-radius: 50%; font-size: 20px; }
  .hdr small { display: block; color: #cba862; font-size: 11px; letter-spacing: 2px; }
  .hdr h2 { margin: 1px 0 0; color: #f8da86; font-size: 23px; letter-spacing: 4px; }
  .sess-date { align-self: center; padding: 4px 8px; color: #f5d580; border: 1px solid #9f7028; font-size: 11px; white-space: nowrap; }

  /* overview body */
  .overview-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; padding: 12px 12px 20px; z-index: 1; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); margin-bottom: 12px; background: linear-gradient(180deg,#160c08cf,#0d0604cf); border: 1px solid #8a6128; box-shadow: inset 0 0 0 1px #e9c16d2b,0 5px 14px #0007; }
  .stats span { position: relative; display: grid; gap: 3px; justify-items: center; padding: 9px 4px; }
  .stats span:not(:last-child)::after { content:''; position:absolute; right:0; top:24%; bottom:24%; border-right:1px solid #78562870; }
  .stats small { color: #bfa06a; font-size: 10px; letter-spacing: 2px; }
  .stats b { color: #f4d382; font-size: 21px; letter-spacing: 1px; }

  /* hall */
  .hall { position: relative; display: grid; grid-template-columns: minmax(0,1fr) 84px minmax(0,1fr); flex: 1; min-height: 340px; align-items: stretch; gap: 16px 14px; padding: 18px 8px; background: linear-gradient(180deg,#0b0705c9,#1c0d0866 50%,#090504c9); border: 1px solid #86592b; box-shadow: inset 0 0 0 1px #e6bd6124,0 10px 24px #0008; }
  .hall::before { content:''; position:absolute; left:50%; top:6%; bottom:6%; border-left:1px solid #c7953f45; box-shadow:0 0 16px #c48a3726; pointer-events:none; }
  .rank { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; }
  .node { position: relative; flex: 0 0 auto; min-height: 74px; display: flex; align-items: center; gap: 11px; padding: 11px 14px; color: #f4d58a; background: linear-gradient(135deg,#3a1f13,#1a0d08 70%); border: 1px solid #b17b2c; border-radius: 7px; box-shadow: inset 0 0 0 1px #f1d1761c,0 6px 14px #0009; cursor: pointer; }
  .node::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:linear-gradient(180deg,#e8c168,#a8741f); }
  .rank.right .node { flex-direction: row-reverse; text-align: right; background: linear-gradient(225deg,#3a1f13,#1a0d08 70%); }
  .rank.right .node::before { left:auto; right:0; }
  .node.empty { opacity: .62; }
  .node.empty::before { background: linear-gradient(180deg,#8a6a33,#5d4718); }
  .main { display: grid; gap: 3px; min-width: 0; }
  .main b { overflow:hidden; font-size:19px; letter-spacing:4px; white-space:nowrap; }
  .main small { overflow:hidden; color:#c7aa70; font-size:11px; letter-spacing:1px; white-space:nowrap; }
  .emblem { flex: 0 0 auto; width: 36px; height: 42px; display: grid; place-items: center; color: #ffe49b; background: linear-gradient(160deg,#8a2620,#5c1510); border: 1px solid #d2a44b; border-radius: 5px; box-shadow: inset 0 0 0 2px #f4d57e26,0 2px 5px #0006; font-size: 23px; font-weight: 700; }
  .badge { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 5px; color: #fff3c0; background: radial-gradient(circle at 35% 30%,#c23a2c,#7e1e18); border: 1px solid #efc86c; border-radius: 11px; box-shadow: 0 0 0 3px #120a06b0,0 3px 7px #0007; font: 700 12px serif; }
  .rank.right .badge { right: auto; left: -9px; }
  .throne { position: relative; align-self: center; justify-self: center; width: 56px; height: 112px; display: grid; place-items: center; color: #f7dd8e; background: linear-gradient(180deg,#3d1f13,#1a0c07); border: 1px solid #cd9a41; border-radius: 7px; box-shadow: 0 0 0 4px #160b086e,0 0 0 5px #c5923b33,0 8px 18px #000b; }
  .throne::before { content:''; position:absolute; width:38px; height:38px; border:2px solid #c5923b7a; border-radius:50%; pointer-events:none; }
  .throne span { position: relative; font-size: 18px; line-height: 1.5; letter-spacing: 8px; writing-mode: vertical-rl; text-shadow: 0 1px 3px #000a; }

  /* attendance */
  .attendance { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 12px; padding: 8px 12px; color: #d4b46f; background: linear-gradient(90deg,#140c08d6,#24150dd6); border: 1px solid #77512a; border-radius: 6px; font-size: 11px; box-shadow: inset 0 0 0 1px #e9c16d1a; }
  .attendance > svg, .attendance > .ic { width: 17px; flex: 0 0 auto; color: #d4b15e; }
  .attendance > span { margin-right: 6px; color: #e7c977; white-space: nowrap; letter-spacing: 2px; }
  .people { display: flex; flex: 1; min-width: 0; gap: 6px; overflow: hidden; }
  .people em { flex: 0 0 auto; width: 23px; height: 23px; display: grid; place-items: center; color: #d7bd80; background: #4c271a; border: 1px solid #95682d; border-radius: 50%; font-style: normal; font-size: 10px; box-shadow: inset 0 0 0 1px #e9c16d1c; }
  .people em.absent, .people em.improper { color: #d79578; background: #3b1714; }
  .people em.late { color: #e4bc6c; background: #4e3a1b; }

  .actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .actions small { color: #a9905e; font-size: 11px; text-align: right; letter-spacing: 1px; }
  .retire { min-width: 130px; min-height: 42px; padding: 8px 18px; color: #e9c979; background: #25120d; border: 1px solid #9b702e; border-radius: 6px; font: 700 15px KaiTi, STKaiti, serif; cursor: pointer; }
</style>
