<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紫宸纪事 · 入宫册封确认 Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070403}body{display:grid;place-items:center;font-family:KaiTi,STKaiti,"Microsoft YaHei",serif}.game{position:relative;width:min(100vw,430px);height:min(100dvh,932px);min-height:700px;overflow:hidden;isolation:isolate;color:#edd18a;background:#130905;box-shadow:0 0 70px #000}.bg{position:absolute;inset:0;z-index:-4;background:linear-gradient(180deg,#0b030125,#0b0301a8 43%,#080302f3 85%),url('./assets/palace.png') center/cover;filter:saturate(.72)}.ray{position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 50% 19%,#ffd98522,transparent 38%);pointer-events:none}.header{height:88px;display:grid;place-items:center;text-align:center;text-shadow:0 2px 8px #000}.header small{font-size:9px;letter-spacing:3px;color:#b99b62}.header h1{margin:3px 0 1px;font-size:29px;font-weight:400;letter-spacing:6px}.header p{margin:0;color:#c9a865;font-size:9px;letter-spacing:2px}.close{position:absolute;right:14px;top:20px;width:34px;height:34px;border:1px solid #ad7c32;border-radius:50%;color:#efd17f;background:#261107;font-size:22px}.steps{height:27px;display:flex;align-items:center;justify-content:center;gap:6px;color:#9b7943;font-size:9px}.steps i{width:25px;height:1px;background:#8e672d}.steps b{color:#e6c574;font-weight:400}.stage{position:relative;height:198px;margin:0 15px;border:1px solid #9b6e2c;background:linear-gradient(90deg,#1b0b06ed,#48250fdb,#1a0a05ed);box-shadow:0 12px 24px #000}.portrait{position:absolute;left:1px;bottom:0;width:150px;height:220px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 12px #000)}.stage-copy{position:absolute;left:142px;right:15px;top:22px}.stage-copy small{font-size:9px;color:#aa8b59}.stage-copy h2{margin:4px 0 2px;font-size:27px;font-weight:400;letter-spacing:5px}.stage-copy p{margin:0;color:#c4a568;font-size:10px}.traits{display:flex;gap:5px;margin-top:10px}.traits span{padding:2px 8px;border:1px solid #9d7337;border-radius:20px;background:#160905;font-size:9px}.family-note{margin-top:11px;padding-top:8px;border-top:1px solid #8c632d66;color:#d9bd7c;font-size:10px;line-height:1.5}.turn{position:absolute;z-index:3;top:76px;width:28px;height:42px;border:0;color:#f0cf77;background:#100704ba;font-size:31px}.prev{left:-10px}.next{right:-10px}.candidate-dots{position:absolute;right:13px;bottom:9px;display:flex;gap:5px}.candidate-dots button{width:7px;height:7px;padding:0;border:1px solid #b08236;border-radius:50%;background:transparent}.candidate-dots .active{background:#e0bb5e}.candidate-dots .done{background:#792a22}
.scroll{position:relative;height:352px;margin:13px 14px 0;padding:12px 18px;color:#4b2b15;background:linear-gradient(105deg,#f1dfad,#dcb970 48%,#eed59c);border:1px solid #9d6627;box-shadow:0 14px 30px #000,inset 0 0 30px #74401028}.scroll:before,.scroll:after{content:"";position:absolute;left:-7px;right:-7px;height:8px;border:1px solid #8a581f;border-radius:50%;background:linear-gradient(#e1bd70,#8e5b22,#d0a451)}.scroll:before{top:-5px}.scroll:after{bottom:-5px}.scroll-title{display:flex;align-items:center;justify-content:center;gap:8px;height:31px;border-bottom:1px solid #8b5a2655;color:#79241e;font-size:17px;letter-spacing:3px}.scroll-title:before,.scroll-title:after{content:"◆";color:#a3793d;font-size:7px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field>span{display:flex;justify-content:space-between;color:#7c5a35;font-size:9px}.field>span em{color:#9b2e27;font-style:normal}.field select,.field input{width:100%;height:38px;padding:0 10px;border:1px solid #a3793e;border-radius:2px;color:#4e2c13;background:#fff7d6b8;font:14px KaiTi,STKaiti,serif;outline:none}.field select:focus,.field input:focus{border-color:#81281f;box-shadow:0 0 0 2px #81281f22}.error{height:12px;margin:3px 0 0;color:#982b25;font-size:9px}.preview{height:59px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:5px;padding:6px 10px;border-top:1px dashed #8b5a2666;border-bottom:1px dashed #8b5a2666;text-align:center}.preview small,.preview strong{display:block}.preview small{color:#896940;font-size:8px}.preview strong{margin-top:2px;color:#73231d;font-size:17px;letter-spacing:2px}.preview i{width:1px;height:35px;background:#9b713e66}.minister{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px;height:52px;margin-top:8px;padding:5px 8px;background:#fff5d34d}.minister-icon{display:grid;place-items:center;width:34px;height:34px;border:1px solid #9f6b2d;border-radius:50%;color:#f2d68c;background:#65261f;font-size:17px}.minister small,.minister b{display:block}.minister small{color:#8a6a42;font-size:8px}.minister b{margin-top:2px;font-size:12px}.minister-office{text-align:right;color:#725637;font-size:9px;line-height:1.45}.limit{color:#8a2c24;font-size:8px}
.confirm{position:absolute;left:30px;right:30px;bottom:max(17px,env(safe-area-inset-bottom));height:57px;border:1px solid #b98737;color:#f5dc94;background:linear-gradient(#7b2a21,#40120d);box-shadow:0 8px 20px #000,inset 0 0 0 3px #e0b95a20;font:16px KaiTi,STKaiti,serif;letter-spacing:4px}.confirm:disabled{opacity:.45}.confirm small{display:block;margin-top:3px;color:#c09e62;font-size:8px;letter-spacing:1px}.edict{position:absolute;z-index:20;inset:0;display:none;place-items:center;padding:24px;background:#070302d9;backdrop-filter:blur(4px)}.edict.open{display:grid}.edict-scroll{position:relative;width:100%;padding:36px 32px;color:#4d2913;background:linear-gradient(90deg,#be8438 0 5%,#f1dc9f 5% 95%,#b8782d 95%);border-top:13px solid #6c2b17;border-bottom:13px solid #6c2b17;box-shadow:0 18px 45px #000;text-align:center;animation:open .35s ease-out}.edict-scroll:before{content:"诏";display:grid;place-items:center;width:45px;height:45px;margin:0 auto 12px;border:2px solid #8e261f;border-radius:50%;color:#8e261f;font-size:24px}.edict-scroll h2{margin:0 0 13px;color:#85251f;font-size:24px;letter-spacing:6px}.edict-scroll p{line-height:2;font-size:13px}.edict-title{margin:18px 0;color:#7b251f;font-size:22px;letter-spacing:3px}.edict-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.edict-actions button{height:40px;border:1px solid #936125;color:#4f2b14;background:#e6c984}.edict-actions .primary{color:#f3d991;background:#6d241b}.toast{position:absolute;z-index:30;left:50%;top:96px;transform:translateX(-50%);padding:8px 14px;border:1px solid #c79a48;color:#efd286;background:#190a05f2;font-size:10px;white-space:nowrap}@keyframes open{from{opacity:0;transform:scaleY(.2)}}
@media(max-height:820px){.header{height:72px}.steps{height:22px}.stage{height:170px}.portrait{height:190px}.stage-copy{top:13px}.family-note{margin-top:7px}.scroll{height:326px;margin-top:9px;padding-top:9px}.form{margin-top:8px;gap:7px 10px}.field select,.field input{height:34px}.preview{height:53px}.minister{height:47px;margin-top:5px}.confirm{height:52px;bottom:9px}}
</style></head><body><main class="game"><div class="bg"></div><div class="ray"></div><header class="header"><div><small>紫宸纪事 · 交泰殿</small><h1>入宫册封确认</h1><p>皇帝御览 · 新人名册终审</p></div><button class="close" aria-label="关闭">×</button></header><div class="steps"><span>殿选</span><i></i><span>留牌</span><i></i><b>册封复核</b><i></i><span>正式入宫</span></div><section class="stage"><button class="turn prev">‹</button><img class="portrait" src="./assets/role-mobile.png" alt="新人立绘"><div class="stage-copy"><small>本届入选秀女</small><h2 id="name"></h2><p id="origin"></p><div class="traits" id="traits"></div><div class="family-note" id="familyNote"></div></div><button class="turn next">›</button><div class="candidate-dots"></div></section><section class="scroll"><div class="scroll-title">御定册封</div><div class="form"><label class="field"><span>位份 <em id="rankLimit"></em></span><select id="rank"></select></label><label class="field"><span>封号 <em>一至二字</em></span><input id="honorific" maxlength="2" placeholder="请输入封号"></label><label class="field full"><span>居所 <em id="residenceRule"></em></span><select id="residence"></select></label></div><p class="error"></p><div class="preview"><div><small>册封称谓</small><strong id="displayTitle"></strong></div><i></i><div><small>入宫后称</small><strong id="fullTitle"></strong></div></div><div class="minister"><span class="minister-icon">臣</span><div><small>关联臣子 · 父亲</small><b id="ministerName"></b></div><span class="minister-office" id="ministerOffice"></span></div></section><button class="confirm"><span>复核完成 · 确认册封</span><small>将生成册封圣旨并写入后宫与朝臣关系</small></button><div class="edict"><section class="edict-scroll"><h2>册封圣旨</h2><p id="edictText"></p><div class="edict-title" id="edictTitle"></div><div class="edict-actions"><button class="cancel">返回修改</button><button class="primary">颁旨入宫</button></div></section></div><div class="toast" hidden></div></main><script>
const ranks=[{name:'皇贵妃',level:7},{name:'贵妃',level:6},{name:'妃',level:5},{name:'嫔',level:4},{name:'贵人',level:3},{name:'常在',level:2},{name:'答应',level:1}];const candidates=[{name:'许映雪',origin:'江南 · 巡抚嫡女',traits:['温婉','善书','知礼'],father:'许文远',fatherRank:'从二品',office:'江南巡抚',max:4,initial:'贵人',honorific:'映'},{name:'顾清和',origin:'京畿 · 尚书嫡女',traits:['端庄','善琴','持重'],father:'顾廷钧',fatherRank:'正二品',office:'吏部尚书',max:4,initial:'嫔',honorific:'清'},{name:'陆昭宁',origin:'河东 · 侍郎嫡女',traits:['明艳','善舞','聪慧'],father:'陆文澜',fatherRank:'正三品',office:'户部侍郎',max:3,initial:'贵人',honorific:'昭'}];const palaces=['储秀宫','承乾宫','钟粹宫','景仁宫','永和宫','翊坤宫','咸福宫','长春宫'];const usedHonorifics=['婉','宁'];let current=0;const choices=new Map();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function rooms(rank){const level=ranks.find(x=>x.name===rank)?.level||1;if(level>=4)return palaces.map(x=>x+'主殿');return palaces.flatMap(x=>[x+'东侧殿',x+'西侧殿'])}function render(){const c=candidates[current],saved=choices.get(current);$('#name').textContent=c.name;$('#origin').textContent=c.origin;$('#traits').innerHTML=c.traits.map(x=>`<span>${x}</span>`).join('');$('#familyNote').innerHTML=`父亲 <b>${c.father}</b> · ${c.fatherRank} ${c.office}`;$('#ministerName').textContent=c.father;$('#ministerOffice').innerHTML=`${c.fatherRank}<br>${c.office}`;$('#rankLimit').textContent=`最高可封${ranks.find(x=>x.level===c.max).name}`;$('#rank').innerHTML=ranks.filter(x=>x.level<=c.max).map(x=>`<option>${x.name}</option>`).join('');$('#rank').value=saved?.rank||c.initial;$('#honorific').value=saved?.honorific??c.honorific;renderRooms(saved?.residence);$('.candidate-dots').innerHTML=candidates.map((_,i)=>`<button data-i="${i}" class="${i===current?'active':''} ${choices.get(i)?.confirmed?'done':''}"></button>`).join('');$$('.candidate-dots button').forEach(b=>b.onclick=()=>switchTo(+b.dataset.i));update()}function renderRooms(preferred){const list=rooms($('#rank').value);$('#residenceRule').textContent=$('#rank').value==='贵人'||$('#rank').value==='常在'||$('#rank').value==='答应'?'低位仅可选侧殿':'嫔位以上可居主殿';$('#residence').innerHTML=list.map(x=>`<option>${x}</option>`).join('');if(preferred&&list.includes(preferred))$('#residence').value=preferred}function update(){const c=candidates[current],h=$('#honorific').value.replace(/[^㐀-鿿]/g,'').slice(0,2);if(h!==$('#honorific').value)$('#honorific').value=h;const duplicate=usedHonorifics.includes(h),empty=!h;$('.error').textContent=empty?'请输入一至二字封号':duplicate?`“${h}”封号已被使用，请重新拟定`:'';const title=(h||c.name.slice(1,2))+$('#rank').value;$('#displayTitle').textContent=title;$('#fullTitle').textContent=title+' · '+$('#residence').value;$('.confirm').disabled=empty||duplicate;choices.set(current,{...choices.get(current),rank:$('#rank').value,honorific:h,residence:$('#residence').value});}function switchTo(i){current=(i+candidates.length)%candidates.length;render()}$('#rank').onchange=()=>{renderRooms();update()};$('#honorific').oninput=update;$('#residence').onchange=update;$('.prev').onclick=()=>switchTo(current-1);$('.next').onclick=()=>switchTo(current+1);$('.close').onclick=()=>showToast('这是独立测试页面');$('.confirm').onclick=()=>{const c=candidates[current],x=choices.get(current);$('#edictText').textContent=`奉天承运，皇帝诏曰：${c.name}端谨淑慎，克娴内则，今册封为${x.honorific}${x.rank}，赐居${x.residence}。钦此。`;$('#edictTitle').textContent=x.honorific+x.rank+' · '+x.residence;$('.edict').classList.add('open')};$('.cancel').onclick=()=>$('.edict').classList.remove('open');$('.primary').onclick=()=>{choices.set(current,{...choices.get(current),confirmed:true});$('.edict').classList.remove('open');showToast(`${candidates[current].name}册封完成，父女关系已同步绑定`);render();setTimeout(()=>{if(current<candidates.length-1)switchTo(current+1)},700)};function showToast(t){$('.toast').textContent=t;$('.toast').hidden=false;setTimeout(()=>$('.toast').hidden=true,1700)}render();
</script></body></html>
