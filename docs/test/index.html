main><script>
const girls=[{name:'沈清和',meta:'江南 · 正六品通判嫡女',num:'壹',traits:['端庄','知礼','善琴'],father:'沈修远',fatherRole:'苏州通判 · 正六品',mother:'金陵顾氏',motherRole:'清流世家',power:'清贵',assessment:'仪态娴雅，应对有度，可堪宫中礼仪。',stats:[86,82,91,88]},{name:'陆昭宁',meta:'京畿 · 从四品少詹事嫡女',num:'贰',traits:['明艳','善舞','聪慧'],father:'陆廷彰',fatherRole:'少詹事 · 从四品',mother:'河东裴氏',motherRole:'簪缨旧族',power:'显贵',assessment:'姿容出众，谈吐机敏，性情略显骄矜。',stats:[94,88,78,72]},{name:'顾婉仪',meta:'山东 · 正五品知州庶女',num:'叁',traits:['温婉','善书','谨慎'],father:'顾文谦',fatherRole:'兖州知州 · 正五品',mother:'柳氏',motherRole:'书香门第',power:'中正',assessment:'进退有礼，书法秀逸，寡言而心思细密。',stats:[82,91,89,84]},{name:'萧令月',meta:'陇西 · 正三品将军嫡女',num:'肆',traits:['英气','善骑','爽朗'],father:'萧承岳',fatherRole:'定远将军 · 正三品',mother:'兰陵郑氏',motherRole:'武勋世家',power:'勋贵',assessment:'神采英发，不拘小节，颇有将门风骨。',stats:[88,74,70,93]}];let current=0,decided=new Set(),timer;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function progress(){$('.progress').innerHTML=girls.map((_,i)=>`<button data-i="${i}" class="${i===current?'active':''} ${decided.has(i)?'decided':''}"></button>`).join('');$$('.progress button').forEach(b=>b.onclick=()=>switchGirl(+b.dataset.i))}function render(){let g=girls[current];$('#name').textContent=g.name;$('#meta').textContent=g.meta;$('#num').textContent=$('#round').textContent=g.num;$('#traits').innerHTML=g.traits.map(x=>`<span>${x}</span>`).join('');['father','fatherRole','mother','motherRole','power','assessment'].forEach(k=>$(`#${k}`).textContent=g[k]);['beauty','talentValue','etiquette','temper'].forEach((k,i)=>$(`#${k}`).textContent=g.stats[i]);$$('[data-stat]').forEach((b,i)=>b.style.width=g.stats[i]+'%');progress()}function switchGirl(i){i=(i+girls.length)%girls.length;if(i===current)return;$('.portrait').classList.add('swap');setTimeout(()=>{current=i;render();$('.portrait').classList.remove('swap')},150)}function toast(t){$('.toast').textContent=t;$('.toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('.toast').classList.remove('show'),1500)}function petals(btn){let r=btn.getBoundingClientRect();for(let i=0;i<8;i++){let p=document.createElement('i');p.className='petal';p.textContent='❀';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+15+'px';p.style.setProperty('--x',(Math.random()-.5)*160+'px');p.style.setProperty('--y',-50-Math.random()*90+'px');$('.game').append(p);setTimeout(()=>p.remove(),1300)}}$('.prev').onclick=()=>switchGirl(current-1);$('.next').onclick=()=>switchGirl(current+1);$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.content').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.id).classList.add('active')});$$('.actions button').forEach(b=>b.onclick=()=>{decided.add(current);petals(b);toast('已'+b.dataset.choice+' · '+girls[current].name+(b.dataset.choice==='留牌'?' 入宫候选':' 遣归本家'));progress();setTimeout(()=>switchGirl(current+1),750)});let dlg=$('dialog');$('.page-close').onclick=()=>toast('当前为试玩页面');$('.close').onclick=$('.ok').onclick=()=>dlg.close();$('.sound').onclick=e=>{e.target.textContent=e.target.textContent==='♪'?'×':'♪';toast(e.target.textContent==='♪'?'背景音效已开启（演示）':'背景音效已关闭')};document.onkeydown=e=>e.key==='ArrowLeft'?switchGirl(current-1):e.key==='ArrowRight'&&switchGirl(current+1);render();
</script></body></html>
